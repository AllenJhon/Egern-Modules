# 琛姐的排班（早晚班定制版）
# 脚本托管在 GitHub：导入模块时会自动从下面的 script_url 拉取脚本，不用再手动粘贴。
# 更新脚本后重新导入模块即可生效（注意 raw.githubusercontent.com 有约 5 分钟缓存）。
name: 琛姐的排班
description: 排班日历小组件；只留早班/晚班，不填日期按 11月1日早班起每天自动轮换（跨月连续），填了按填写的来
author: iBL3ND
icon: https://iili.io/nmvgG7R.webp
env_schema:
  SHIFT_ZAO:
    name: 早班
    description: 留空=自动轮换；想改某天就填日期号，逗号分隔，如：2,9,16
    default_value: ''
  SHIFT_YE:
    name: 晚班
    description: 留空=自动轮换；想改某天就填日期号，逗号分隔，如：3,10,17
    default_value: ''
dns: {}
scriptings:
- generic:
    name: shift-widget
    script_url: "https://raw.githubusercontent.com/AllenJhon/Egern-Modules/main/Egern/Sched-Widget-%E6%97%A9%E6%99%9A%E7%8F%AD.js"
    timeout: 30
widgets:
- name: shift-widget
  script_name: shift-widget
