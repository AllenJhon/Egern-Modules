name: "微信公众号+小程序去广告-测试版"
description: "V3 改动：MITM 改为 hostnames.includes 写法（与 Egern 主配置示例一致，旧的扁平列表在部分版本会被静默忽略）；getappmsgad 仍按原格式返回无广告；补 mp/ad.* 接口。"
author: "Muse"
icon: "shield.fill"

rules:
  - domain_suffix:
      match: "wxs.qq.com"
      policy: REJECT
  - domain:
      match: "wxsmsdy.video.qq.com"
      policy: REJECT
  - domain:
      match: "wxsnsdythumb.wxs.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "gdt.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "pgdt.gtimg.cn"
      policy: REJECT
  - domain_suffix:
      match: "pgdt.ugdtimg.com"
      policy: REJECT
  - domain:
      match: "sdk.e.qq.com"
      policy: REJECT
  - domain:
      match: "tangram.e.qq.com"
      policy: REJECT

map_locals:
  - match: '^https://mp\.weixin\.qq\.com/mp/getappmsgad(\?|$)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"advertisement_num":0,"advertisement_info":[]}'
  - match: '^https://mp\.weixin\.qq\.com/mp/(masonryfeed|relatedarticle|relatedsearchword)(\?|$)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://mp\.weixin\.qq\.com/mp/ad.*'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://mp\.weixin\.qq\.com/mp/cps_product_info(\?|$)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://mp\.weixin\.qq\.com/mp/jsmonitor(\?|$)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'

mitm:
  hostnames:
    includes:
      - "mp.weixin.qq.com"
      - "*.wxs.qq.com"
